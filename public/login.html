<form id="login-app" class="w-75 mx-auto">
    <h1 class="fw-light fs-3">Login</h1>
    <div class="mb-3">
        <label for="user-login" class="form-label">User login</label>
        <input 
            type="text" name="user-login" 
            id="user-login" class="form-control form-control-lg"
            placeholder="Your best e-mail"
            required
            autofocus>
    </div>
    <div class="mb-3">
        <label for="user-password" class="form-label">User password</label>
        <input 
            type="password" name="user-password" 
            id="user-password" class="form-control form-control-lg"
            placeholder="Your secret pass"
            required>
    </div>
    <div class="float-end btn-group">
        <a href="#forgot" class="btn btn-sm btn-light">I forgot password</a>
        <button class="btn btn-sm btn-dark">Sign in</button>
    </div>
</form>
