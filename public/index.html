<!DOCTYPE html>
<html lang="en">
<head>
    <base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- seo -->
    <meta name="keywords" content="HTML5,CSS3, javascript, template">
    <meta name="description" content="Projeto de base para criar estilizar e processar uma página web com HTML5, CSS3 e JavaScript.">
    <!-- links fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- links style -->
    <link rel="shortcut icon" href="img/code-slash.svg" type="image/svg+xml">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.min.css">
    <!-- script -->
    <script defer src="js/main.min.js"> // =] </script>

    <title>Template</title>
</head>

<body class="bg-light">

    <header class="fixed-top py-2 bg-white">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center border-bottom">
                <h1 class="fw-light fs-2">
                    <a 
                        id="home" class="text-decoration-none p-0 text-dark"
                        data-action="content"
                        tabindex="-1" href="#home">Template</a>
                </h1>
                <button id="menu" class="btn m-0 p-0" aria-label="Menu">
                    <i class="bi bi-three-dots-vertical"></i>
                    <span class="d-none">Menu</span>
                </button>
            </div>
        </div>
    </header>
    
    <aside>
        <header>
            <h1 class="fw-light fs-3 py-2 m-0">Menu</h1>
            <nav class="p-0">
                <button id="close" class="btn p-0 m-0" aria-label="Fechar">
                    <i class="bi bi-x-lg fs-3"></i>
                    <span class="d-none">Fechar</span>
                </button>
            </nav>
        </header>

        <nav id="nav-menu">
            <template>
                <a data-action="content" href="#link" class="btn btn-sm btn-secondary d-block text-start">text-link</a>
            </template>
        </nav>

        <footer class="bg-secondary py-0 m-0">
            <nav class="btn-group">
                <a data-action="modal" href="#login" class="btn btn-sm btn-secondary"><i class="bi bi-person-fill"></i><span class="d-none d-md-inline ps-2">Login</span></a>
                <a data-action="modal" href="#register" class="btn btn-sm btn-secondary"><i class="bi bi-person-fill-add"></i><span class="d-none d-md-inline ps-2">Register</span></a>
            </nav>
        </footer>
    </aside>
    
    <main class="my-5 py-4">
        <div id="content" class="container">
            <div class="spinner">loading</div>
        </div>
    </main>
    
    <footer class="fixed-bottom pb-2 bg-light">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center border-top pt-2">
                <p id="date" class="m-0"><small>{{Since 2025}}</small></p>
                <nav class="btn-group">
                    <a data-action="content" href="#home" class="btn btn-sm btn-light py-0"><i class="bi bi-house-fill"></i><span class="d-none d-md-inline ps-2">Home</span></a>
                    <a data-action="content" href="#about" class="btn btn-sm btn-light py-0"><i class="bi bi-info-circle-fill"></i><span class="d-none d-md-inline ps-2">About</span></a>
                    <a data-action="content" href="#privacy" class="btn btn-sm btn-light py-0"><i class="bi bi-shield-fill-check"></i><span class="d-none d-md-inline ps-2">Privacy</span></a>
                    <a href="https://github.com/martchelou/template-base" title="github" target="_blank" rel="noopener noreferrer" class="btn btn-sm btn-light py-0 text-dark" aria-label="github"><i class="bi bi-github"></i><span class="d-none d-md-inline ps-2">Repo</span></a>
                </nav>
            </div>
        </div>
    </footer>

    <dialog id="modal">
        <button id="modal-close-btn" class="btn p-0" aria-label="fechar">
            <i class="bi bi-x-lg"></i>
            <span class="d-none">Fechar</span>
        </button>
        <div id="modal-body">
            <div class="spinner">loading</div>
        </div>        
    </dialog>
    
</body>
</html>
